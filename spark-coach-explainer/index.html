    <div id="app"></div>
    <script type="text/javascript">
  (function(root) {
    window.partnerContent = [];

    function isExport() {
      return true;
    }

    function resolvePath(path) {
      return ('spark-coach-explainer/assets/').concat(path);
    }

    function resolveFontPath(font) {
      return ('spark-coach-explainer/lib/fonts/').concat(font.key.split('/').reverse()[0]);
    }

    root.Runtime = {
      fetch: window.__fetchCourse,
      isExport: isExport,
      resolvePath: resolvePath,
      resolveFontPath: resolveFontPath
    };
  }(window));
</script>
