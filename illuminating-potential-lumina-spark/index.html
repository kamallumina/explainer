<script>
(function () {
  "use strict";

  const MARKER = "[AI_KNOWLEDGE]";

  function hideKnowledgeBlocks() {
    document.querySelectorAll("p").forEach(function (p) {

      // Only match paragraphs starting with our marker
      const text = p.textContent.trim();

      if (!text.startsWith(MARKER)) return;

      // Find the enclosing Rise block
      const block = p.closest("[data-block-id]");

      if (block) {
        block.style.setProperty(
          "display", "none", "important"
        );
      }
    });
  }

  // Run after initial page load
  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      hideKnowledgeBlocks
    );
  } else {
    hideKnowledgeBlocks();
  }

  // Handle dynamically loaded Rise lessons
  const observer = new MutationObserver(function () {
    hideKnowledgeBlocks();
  });

  observer.observe(document.documentElement, {
    childList: true,
    subtree: true
  });

})();
</script>
