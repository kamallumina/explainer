    <script type="text/javascript">
  (function(root) {
    window.partnerContent = [];

    function isExport() {
      return true;

    function resolvePath(path) {
      return ('journey-to-composure-explainer-french/assets/').concat(path);
    }

    function resolveFontPath(font) {
      return ('journey-to-composure-explainer-french/lib/fonts/').concat(font.key.split('/').reverse()[0]);
    }

    root.Runtime = {
      fetch: window.__fetchCourse,
      isExport: isExport,
      resolvePath: resolvePath,
      resolveFontPath: resolveFontPath
    };
  }(window));
