    <script type="text/javascript">
  (function(root) {
    window.partnerContent = [];

      return ('spark-coach-explainer-french/assets/').concat(path);

      return ('spark-coach-explainer-french/lib/fonts/').concat(font.key.split('/').reverse()[0]);

    root.Runtime = {
      fetch: window.__fetchCourse,
      isExport: isExport,
      resolvePath: resolvePath,
      resolveFontPath: resolveFontPath
    };
  }(window));
